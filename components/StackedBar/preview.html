<!-- @dsCard group="Datos" height=93 subtitle="Barra horizontal en segmentos redondeados" -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);padding:24px;box-sizing:border-box}</style>
</head><body><div id="r"></div>
<script>
var h=React.createElement,K=window.AppKit;
function Demo(){return h('div',{style:{maxWidth:360,display:'grid',gap:12}},h(K.StackedBar,{segments:[{value:50,tone:'accent'},{value:30,tone:'amber'},{value:20,tone:'teal'}]}),h(K.Legend,{items:[{label:'Búsqueda orgánica',tone:'accent'},{label:'Redes sociales',tone:'amber'},{label:'Directo',tone:'teal'}]}));}
ReactDOM.createRoot(document.getElementById('r')).render(h(Demo));
</script></body></html>
