<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);padding:24px;box-sizing:border-box}</style>
</head><body><div id="r"></div>
<script>
var h=React.createElement,K=window.AppKit;
function Demo(){return h('div',{style:{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}},h(K.Chip,{tone:'amber',dot:true},'Cambios sin publicar'),h(K.Chip,{tone:'green',icon:'check'},'Publicado'),h(K.Chip,{tone:'accent'},'Descanso'),h(K.Chip,{tone:'dark'},'Producción'),h(K.Chip,{tone:'white'},'Visitas'),h(K.Chip,{tone:'ghost'},'Filtros'),h(K.Chip,null,'Neutro'),h(K.Chip,{tone:'green',size:'sm'},'sm'));}
ReactDOM.createRoot(document.getElementById('r')).render(h(Demo));
</script></body></html>
