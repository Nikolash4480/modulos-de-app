<!-- @dsCard height=288 -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
.c{position:relative;width:960px;height:288px;background:var(--bg);overflow:hidden;font-family:var(--font-sans)}
svg{position:absolute;left:0;top:0;display:block}
.t{position:absolute;left:40px;bottom:36px;width:440px}
h1{margin:0;font-size:56px;line-height:1;font-weight:600;letter-spacing:-.03em;color:var(--ink)}
p{margin:14px 0 0;font-size:14px;line-height:20px;color:var(--ink-2)}
</style></head>
<body><div class="c">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!-- bloques: ink 200×288 (sangra arriba y abajo), accent 160×168, green 120×120 (sangra arriba y a la derecha), paper 160×120, highlight 120×168 -->
<!-- disposición: losa alta de tinta con satélites escalonados a la derecha; lados en múltiplos de 8px -->
<!-- patrón: cuadrícula de puntos de 20px del lienzo de flujos, sobre el bloque de papel -->
<!-- escalas: app suave → esquinas de radius-lg en los satélites, ángulos rectos solo en la losa -->
<defs><pattern id="d" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="var(--ink)" opacity=".35"/></pattern></defs>
<rect x="480" y="0" width="200" height="288" fill="var(--ink)"/>
<rect x="680" y="0" width="160" height="168" rx="16" fill="var(--accent)"/>
<rect x="840" y="0" width="120" height="120" rx="16" fill="var(--green)"/>
<rect x="680" y="176" width="160" height="112" rx="16" fill="var(--paper)"/>
<rect x="680" y="176" width="160" height="112" rx="16" fill="url(#d)"/>
<rect x="848" y="128" width="112" height="160" rx="16" fill="var(--highlight)"/>
</svg>
<div class="t"><h1>Módulos<br>de App</h1><p>Piezas sueltas para pantallas de app.</p></div>
</div></body></html>
